server:
  port: ${SERVER_PORT:8123}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    context-path: /api
    session:
      cookie:
        name: YU_PICTURE_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: yu-picture-backend
  config:
    # External configuration is intentionally excluded from packaged jars.
    import: optional:file:./application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yu_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:yu_picture}
    password: ${DB_PASSWORD:}
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5s
  session:
    store-type: redis
    timeout: 24h
    redis:
      namespace: yu-picture:session
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
sa-token:
  token-name: yu-picture-token
knife4j:
  enable: ${API_DOCS_ENABLED:false}
springfox:
  documentation:
    enabled: ${API_DOCS_ENABLED:false}
app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}
